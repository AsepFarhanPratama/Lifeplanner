<style>
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --surfaceAlt:#F1F1EF; --border:#EAEAE6;
  --text:#1B1D22; --textSoft:#7A7D85; --textFaint:#AEB0B6;
  --accent:#2F6FED; --accentSoft:#E9F0FE; --danger:#D64545; --dangerSoft:#FBEAEA;
  --navy:#0B1E3D; --radius:18px;
}
[data-theme="dark"]{
  --bg:#0F1115; --surface:#191C22; --surfaceAlt:#20242C; --border:#2A2E37;
  --text:#F2F2F0; --textSoft:#9AA0AC; --textFaint:#5D6270;
  --accent:#2F6FED; --accentSoft:#122A4F; --danger:#D64545; --dangerSoft:#2E1B1B;
  --navy:#0B1E3D;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:"Inter",system-ui,sans-serif;
  overscroll-behavior:none; transition:background-color .3s ease,color .3s ease;
}
h1,h2,h3,.brand{font-family:"Poppins",system-ui,sans-serif;}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit;}
input,select,textarea{font-family:inherit; font-size:14px;}
::-webkit-scrollbar{display:none; width:0; height:0;}
*{scrollbar-width:none; -ms-overflow-style:none;}

#app{max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; position:relative; background:var(--bg); overflow:hidden;}

/* ---------- Splash ---------- */
.splash{height:100vh; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff;}
.splash svg{animation:logoPop .7s cubic-bezier(.2,.9,.25,1);}
.splash .brand{font-weight:600; font-size:22px; color:var(--navy); margin-top:16px; animation:fadeIn .8s ease .3s both;}
.splash .tag{font-size:12.5px; color:#6E86AE; margin-top:6px; animation:fadeIn .8s ease .5s both;}
.splash .loadbar{margin-top:26px; width:120px; height:3px; border-radius:99px; background:#E9F0FE; overflow:hidden; animation:fadeIn .6s ease .6s both;}
.splash .loadbar > div{width:40%; height:100%; border-radius:99px; background:linear-gradient(90deg,#3DAEDB,#2F6FED); animation:loadBar 1.3s ease .7s both;}

/* ---------- Onboarding ---------- */
.onboard{height:100vh; height:100dvh; display:flex; flex-direction:column;}
.onboard .skip{display:flex; justify-content:flex-end; padding:20px;}
.onboard .skip button{font-size:14px; color:var(--textSoft); font-weight:500;}
.onboard .body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 40px; text-align:center;}
.onboard .icon{width:96px; height:96px; border-radius:26px; background:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:32px; color:#fff;}
.onboard .title{font-weight:600; font-size:21px; color:var(--text);}
.onboard .desc{font-size:14px; color:var(--textSoft); margin-top:10px; line-height:1.5;}
.onboard .dots{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:32px;}
.onboard .dot{height:6px; border-radius:99px; background:var(--border); transition:all .3s;}
.onboard .dot.active{width:20px; background:var(--accent);}
.onboard .dot:not(.active){width:6px;}
.onboard .cta{padding:0 24px 40px;}
.onboard .cta button{width:100%; padding:15px; border-radius:16px; background:var(--accent); color:#fff; font-weight:600; font-size:15px;}

/* ---------- App shell ---------- */
.shell{height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative;}
.content{flex:1; overflow-y:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch;}
.content.anim{animation:tabIn .32s cubic-bezier(.2,.8,.25,1);}

.bottomnav{display:flex; align-items:center; justify-content:space-around; background:var(--surface); border-top:1px solid var(--border); padding:8px 0 max(14px,env(safe-area-inset-bottom)); position:relative; z-index:20;}
.navbtn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 10px; color:var(--textFaint);}
.navbtn.active{color:var(--accent);}
.navbtn span{font-size:10.5px; font-weight:500;}
.navbtn.active span{font-weight:600;}

.fab{position:absolute; right:18px; bottom:calc(78px + env(safe-area-inset-bottom)); width:54px; height:54px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(47,111,237,.4); animation:pulseGlow 2.6s ease-in-out infinite; z-index:25;}

/* ---------- Cards / generic ---------- */
.px{padding-left:20px; padding-right:20px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); transition:background-color .3s,border-color .3s;}
.section-title{font-family:"Poppins",sans-serif; font-weight:600; font-size:14px; color:var(--text); margin-bottom:10px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.seeall{color:var(--accent); font-size:11.5px; font-weight:500; display:flex; align-items:center; gap:2px;}
.chip{padding:6px 12px; border-radius:99px; font-size:12px; font-weight:500; white-space:nowrap; border:1px solid rgba(122,125,133,.3); color:var(--textSoft); background:transparent; transition:all .2s;}
.chip.active{color:#fff; border-color:var(--accent); background:var(--accent);}
.pbar{height:8px; border-radius:99px; background:var(--surfaceAlt); overflow:hidden; width:100%;}
.pbar > div{height:100%; border-radius:99px; background:var(--accent); transition:width .4s ease;}
.badge{padding:2px 8px; border-radius:99px; font-size:9.5px; font-weight:600; background:var(--accentSoft); color:var(--accent);}
.empty{display:flex; flex-direction:column; align-items:center; text-align:center; padding:56px 24px;}
.empty .ic{width:64px; height:64px; border-radius:18px; background:var(--accentSoft); display:flex; align-items:center; justify-content:center; margin-bottom:16px;}
.empty .t{font-weight:600; font-size:16px; color:var(--text); margin-bottom:4px;}
.empty .s{font-size:13px; color:var(--textSoft); margin-bottom:20px;}
.empty button{padding:10px 18px; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; font-size:13px;}
.iconbtn{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border);}
.avatar{width:44px; height:44px; border-radius:50%; overflow:hidden; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.avatar img{width:100%; height:100%; object-fit:cover;}

/* ---------- Topbar (subpages) ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 20px 14px; position:sticky; top:0; background:var(--bg); z-index:5;}
.topbar .left{display:flex; align-items:center; gap:8px;}
.topbar .title{font-family:"Poppins",sans-serif; font-weight:600; font-size:18px;}

/* ---------- Sheets / overlays ---------- */
.backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; animation:backdropIn .2s ease;}
.sheet{width:100%; max-width:480px; max-height:88vh; overflow-y:auto; background:var(--surface); border-radius:24px 24px 0 0; padding:16px 20px calc(24px + env(safe-area-inset-bottom)); animation:slideUp .28s cubic-bezier(.2,.8,.25,1);}
.sheet .handle{width:40px; height:4px; border-radius:99px; background:var(--border); margin:0 auto 16px;}
.sheet .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.sheet .head .t{font-family:"Poppins",sans-serif; font-weight:600; font-size:16px;}
.field{margin-bottom:12px;}
.field label{font-size:12px; font-weight:500; color:var(--textSoft); display:block; margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; padding:11px 12px; border-radius:12px; background:var(--surfaceAlt); border:1px solid var(--border); color:var(--text); outline:none;}
.field textarea{resize:none; min-height:80px;}
.btn-primary{width:100%; padding:13px; border-radius:14px; background:var(--accent); color:#fff; font-weight:600; font-size:14px; margin-top:6px;}
.btn-primary:disabled{background:var(--textFaint);}
.btn-danger{width:100%; padding:11px; border-radius:14px; background:transparent; border:1px solid var(--dangerSoft); color:var(--danger); font-weight:600; font-size:13px; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:6px;}

.page{position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; z-index:30; animation:slideInRight .28s cubic-bezier(.2,.8,.25,1);}
.page .body{flex:1; overflow-y:auto; padding:0 20px 24px;}

/* ---------- Notifications ---------- */
.banners{position:absolute; left:0; right:0; top:max(10px,env(safe-area-inset-top)); z-index:60; padding:0 14px; display:flex; flex-direction:column; gap:8px;}
.banner{display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px 14px; box-shadow:0 10px 30px rgba(11,30,61,.2); animation:notifDrop .35s cubic-bezier(.2,.8,.25,1);}
.banner .bic{width:32px; height:32px; border-radius:50%; background:var(--accentSoft); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.banner .t{font-size:12.5px; font-weight:700;}
.banner .s{font-size:11.5px; color:var(--textSoft);}

.toast{position:absolute; left:50%; bottom:100px; transform:translateX(-50%); background:var(--accent); color:#fff; padding:10px 16px; border-radius:12px; font-size:12.5px; font-weight:500; box-shadow:0 8px 20px rgba(47,111,237,.4); animation:slideUp .3s cubic-bezier(.2,.8,.25,1); white-space:nowrap; z-index:70;}

/* ---------- Grid / misc ---------- */
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.row{display:flex; align-items:center;}
.between{justify-content:space-between;}
.gap2{gap:8px;} .gap3{gap:12px;}
.scrollx{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
.finance-hero{background:var(--navy); border-radius:18px; padding:16px; color:#fff;}
.toggle{width:40px; height:23px; border-radius:99px; background:var(--border); position:relative; transition:background .2s; flex-shrink:0;}
.toggle.on{background:var(--accent);}
.toggle .dot{width:17px; height:17px; border-radius:99px; background:#fff; position:absolute; top:3px; left:3px; transition:left .2s;}
.toggle.on .dot{left:20px;}

@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes slideUp{from{transform:translateY(30px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
@keyframes logoPop{0%{opacity:0; transform:scale(.7) rotate(-6deg);} 60%{opacity:1; transform:scale(1.06) rotate(2deg);} 100%{opacity:1; transform:scale(1) rotate(0);}}
@keyframes loadBar{0%{transform:translateX(-100%);} 100%{transform:translateX(250%);}}
@keyframes tabIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes slideInRight{from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:translateX(0);}}
@keyframes pulseGlow{0%,100%{box-shadow:0 8px 20px rgba(47,111,237,.4);} 50%{box-shadow:0 8px 26px rgba(47,111,237,.7);}}
@keyframes backdropIn{from{opacity:0;} to{opacity:1;}}
@keyframes notifDrop{from{opacity:0; transform:translateY(-14px);} to{opacity:1; transform:translateY(0);}}
button{transition:transform .15s ease, opacity .15s ease;}
button:active{transform:scale(.94);}

</style>

/* ---------------- SEED DATA ---------------- */
function seedData() {
  return {
    profile: { name: "Pengguna", email: "", photo: null },
    settings: { dark: false, notifEnabled: false, appLock: false, onboarded: false },
    tasks: [],
    events: [],
    notes: [],
    transactions: [],
    goals: [],
    habits: [],
    journal: [],
  };
}

/* ---------------- PENYIMPANAN (localStorage + cadangan IndexedDB) ----------------
   Data disimpan di browser pengguna yang membuka website ini, jadi tetap ada
   saat halaman di-refresh atau ditutup. IndexedDB dipakai sebagai cadangan
   kalau localStorage terhapus/penuh. */
const Store = {
  _db: null,
  _open() {
    return new Promise((resolve) => {
      if (this._db) return resolve(this._db);
      if (!window.indexedDB) return resolve(null);
      try {
        const req = indexedDB.open("lifeplanner_db", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onsuccess = () => { this._db = req.result; resolve(this._db); };
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },
  async idbGet() {
    const db = await this._open();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const r = db.transaction("kv", "readonly").objectStore("kv").get(STORE_KEY);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },
  async idbSet(str) {
    const db = await this._open();
    if (!db) return;
    try { db.transaction("kv", "readwrite").objectStore("kv").put(str, STORE_KEY); } catch (e) {}
  },
  lsGet() { try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } },
  lsSet(str) { try { localStorage.setItem(STORE_KEY, str); return true; } catch (e) { return false; } },
  async requestPersist() {
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  },
};

/* ---------------- APP STATE ---------------- */
const App = {
  state: null,
  stage: "splash", // splash | onboarding | app
  onboardIdx: 0,
  tab: "home",
  overlay: null, // {type, ...}
  locked: false,
  banners: [],
  toastMsg: null,
  agendaDate: TODAY,
  noteSearch: "",
  noteFilter: "Semua",
  financeSubTab: "transactions",
  _notifTimer: null,

  normalize() {
    const base = seedData();
    if (!this.state || typeof this.state !== "object") this.state = base;
    Object.keys(base).forEach((k) => { if (this.state[k] == null) this.state[k] = base[k]; });
    this.state.settings = Object.assign({}, base.settings, this.state.settings);
    this.state.profile = Object.assign({}, base.profile, this.state.profile);
  },
  async load() {
    let raw = Store.lsGet();
    if (!raw) raw = await Store.idbGet(); // localStorage kosong -> coba cadangan
    try { this.state = raw ? JSON.parse(raw) : seedData(); } catch (e) { this.state = seedData(); }
    this.normalize();
    if (raw) Store.lsSet(JSON.stringify(this.state)); // sinkronkan lagi ke localStorage
  },
  save() {
    const str = JSON.stringify(this.state);
    const ok = Store.lsSet(str);
    Store.idbSet(str);
    if (!ok && !this._warnedStorage) { this._warnedStorage = true; this.showToast("Penyimpanan penuh, data disimpan di cadangan"); }
  },
  async init() {
    this.stage = "splash";
    this.state = seedData();
    this.render();
    Store.requestPersist();
    await this.load();
    document.body.setAttribute("data-theme", this.state.settings.dark ? "dark" : "light");
    setTimeout(() => {
      this.stage = this.state.settings.onboarded ? "app" : "onboarding";
      if (this.stage === "app" && this.state.settings.notifEnabled) this.startNotifLoop();
      this.render();
    }, 1300);
  },

  goTab(tab) { this.tab = tab; this.overlay = null; this.render(); window.scrollTo(0, 0); },
  openOverlay(ov) { this.overlay = ov; this.render(); },
  closeOverlay() { this.overlay = null; this.render(); },
  toggleDark() {
    this.state.settings.dark = !this.state.settings.dark;
    document.body.setAttribute("data-theme", this.state.settings.dark ? "dark" : "light");
    this.save(); this.render();
  },
  showToast(msg) {
    this.toastMsg = msg; this.render();
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { this.toastMsg = null; this.render(); }, 1800);
  },
  pushBanner(title, body) {
    const bid = uid();
    this.banners.push({ id: bid, title, body });
    this.render();
    if (this.state.settings.notifEnabled && "Notification" in window && Notification.permission === "granted") {
      try { new Notification(title, { body, icon: "icons/icon-192.png" }); } catch (e) {}
    }
    setTimeout(() => { this.banners = this.banners.filter((b) => b.id !== bid); this.render(); }, 5500);
  },
  dismissBanner(id) { this.banners = this.banners.filter((b) => b.id !== id); this.render(); },

  async enableNotifications() {
    if ("Notification" in window) {
      try {
        const perm = await Notification.requestPermission();
        this.state.settings.notifEnabled = true; // still enable in-app banners even if OS permission denied
      } catch (e) { this.state.settings.notifEnabled = true; }
    } else {
      this.state.settings.notifEnabled = true;
    }
    this.save(); this.render();
    this.showToast("Pengingat diaktifkan ✓");
    this.startNotifLoop();
    setTimeout(() => this.pushBanner("⏰ Life Planner", "Notifikasi pengingat aktif. Kamu akan diingatkan sebelum agenda dimulai."), 1000);
  },
  disableNotifications() {
    this.state.settings.notifEnabled = false; this.save(); this.render();
    this.showToast("Pengingat dimatikan");
    this.stopNotifLoop();
  },
  startNotifLoop() {
    this.stopNotifLoop();
    const check = () => {
      const now = new Date();
      this.state.events.forEach((e) => {
        if (e.date !== TODAY || e.notified) return;
        const parts = e.time.split(":");
        const evTime = new Date();
        evTime.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
        const diffMin = (evTime - now) / 60000;
        if (diffMin > 0 && diffMin <= 30) {
          this.pushBanner("⏰ " + Math.round(diffMin) + " menit lagi", "Agenda: " + e.title);
          e.notified = true;
          this.save();
        }
      });
    };
    check();
    this._notifTimer = setInterval(check, 20000);
  },
  stopNotifLoop() { if (this._notifTimer) clearInterval(this._notifTimer); this._notifTimer = null; },

  exportData() {
    try {
      const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "life-planner-backup.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      this.showToast("Data diekspor ✓");
    } catch (e) { this.showToast("Export gagal"); }
  },
  importFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        this.state = Object.assign(seedData(), parsed);
        this.normalize();
        this.save();
        this.showToast("Data berhasil diimpor ✓");
        this.closeOverlay();
        this.render();
      } catch (e) { this.showToast("File tidak valid"); }
    };
    reader.readAsText(file);
  },
};

  addNote(n) { this.state.notes.unshift(Object.assign({ id: uid(), pinned: false, favorite: false }, n)); this.save(); },

  addTransaction(t) { this.state.transactions.unshift(Object.assign({ id: uid() }, t)); this.save(); },

  addHabit(name) { this.state.habits.push({ id: uid(), name, streak: 0, doneToday: false, log: [0,0,0,0,0,0,0] }); this.save(); },

    const maxCat = topCats[0];

            ${grouped[date].map((t, i) => `

                  <div><div style="font-size:13px;font-weight:500;">${t.category}</div><div style="font-size:10.5px;color:var(--textSoft);">${esc(t.note) || "-"}</div></div>

                <div class="row gap2">
                  <div style="font-size:13px;font-weight:600;color:${t.type === "income" ? "var(--accent)" : "var(--danger)"};">${t.type === "income" ? "+" : "-"}${fmtRp(t.amount)}</div>
                  <button onclick='App.openOverlay({type:"form",formType:"${t.type}",editId:"${t.id}"})'>${icon("pencil", 13, "var(--textFaint)")}</button>
                  <button onclick="App.deleteTransaction('${t.id}')">${icon("trash", 13, "var(--textFaint)")}</button>
                </div>
              </div>`).join("")}
          </div>
        </div>`).join("");
    }

    const analyticsHtml = `
      <div class="card" style="padding:16px;margin-bottom:16px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:3px;">Pengeluaran Terbesar</div>
        <div style="font-size:11.5px;color:var(--textSoft);">${maxCat ? `${maxCat[0]} — ${fmtRp(maxCat[1])}` : "-"}</div>
      </div>
      <div class="section-title">Top Spending Categories</div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${topCats.map(([cat, amt]) => { const pct = Math.round((amt / totalExpense) * 100); return `
          <div><div class="row between" style="font-size:12px;margin-bottom:4px;"><span>${cat}</span><span style="color:var(--textSoft);">${pct}%</span></div>
          <div class="pbar" style="height:7px;"><div style="width:${pct}%;background:${EXPENSE_COLORS[cat] || "var(--accent)"};"></div></div></div>`;
        }).join("")}
      </div>`;

    return `<div style="padding-top:12px;">
      <div class="px"><div style="font-family:'Poppins',sans-serif;font-weight:600;font-size:18px;margin-bottom:16px;">Finance</div></div>
      <div class="px" style="margin-bottom:16px;">
        <div class="finance-hero">
          <div style="font-size:11px;color:#9AA0AC;">Balance</div>
          <div style="font-size:22px;font-weight:700;font-family:'Poppins',sans-serif;">${fmtRp(balance)}</div>
          <div class="row gap3" style="margin-top:12px;">
            <div><div style="font-size:9.5px;color:#8C90A0;">Income</div><div style="font-size:13px;color:#6FA0FF;font-weight:600;">${fmtRp(totalIncome)}</div></div>
            <div><div style="font-size:9.5px;color:#8C90A0;">Expense</div><div style="font-size:13px;color:#E88888;font-weight:600;">${fmtRp(totalExpense)}</div></div>
          </div>
        </div>
      </div>
      <div class="px row gap2" style="margin-bottom:16px;">
        <button class="chip ${this.financeSubTab === "transactions" ? "active" : ""}" onclick="App.setFinanceSubTab('transactions')">Transactions</button>
        <button class="chip ${this.financeSubTab === "analytics" ? "active" : ""}" onclick="App.setFinanceSubTab('analytics')">Analytics</button>

      </div>
      <div class="scrollx px" style="margin-bottom:16px;">

              </div>
              <button style="text-align:left;width:100%;" onclick='App.openOverlay({type:"form",formType:"note",editId:"${n.id}"})'>
                <div style="font-size:13px;font-weight:600;margin-bottom:3px;">${esc(n.title)}</div>
                <div style="font-size:11px;color:var(--textSoft);line-height:1.4;">${esc(n.content.length > 60 ? n.content.slice(0, 60) + "…" : n.content)}</div>
              </button>
              <div class="row gap3" style="justify-content:flex-end;margin-top:8px;">
                <button onclick='App.openOverlay({type:"form",formType:"note",editId:"${n.id}"})'>${icon("pencil", 12, "var(--textFaint)")}</button>
                <button onclick="App.deleteNote('${n.id}')">${icon("trash", 12, "var(--textFaint)")}</button>

Object.assign(App, {
  renderOverlay() {
    const ov = this.overlay;
    if (!ov) return "";
    if (ov.type === "quickAdd") return this.renderQuickAdd();
    if (ov.type === "form") return this.renderFormSheet();
    if (ov.type === "page") return this.renderPage();
    if (ov.type === "about") return this.renderAboutSheet();
    if (ov.type === "editProfile") return this.renderEditProfileSheet();
    if (ov.type === "import") return this.renderImportSheet();
    return "";
  },

  renderQuickAdd() {
    const options = [
      ["Add Task", "task", "listcheck"], ["Add Note", "note", "note"],
      ["Add Expense", "expense", "arrowdown"], ["Add Income", "income", "arrowup"],
      ["Add Event", "event", "calendar"], ["Add Goal", "goal", "target"],
    ];
    return `<div class="backdrop" onclick="App.closeOverlay()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="handle"></div>
        <div class="head"><div class="t">Quick Add</div><button onclick="App.closeOverlay()">${icon("x", 15, "var(--textSoft)")}</button></div>
        <div class="grid3" style="gap:12px;">
          ${options.map(([label, type, ic]) => `<button class="card" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;background:var(--surfaceAlt);border:none;" onclick='App.openOverlay({type:"form",formType:"${type}"})'>
            ${icon(ic, 19, "var(--accent)")}<span style="font-size:10.5px;font-weight:500;">${label}</span>
          </button>`).join("")}
        </div>
      </div>
    </div>`;
  },

  renderAboutSheet() {
    return `<div class="backdrop" onclick="App.closeOverlay()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="handle"></div>
        <div class="head"><div class="t">About Life Planner</div><button onclick="App.closeOverlay()">${icon("x", 15, "var(--textSoft)")}</button></div>
        <div style="font-size:13px;color:var(--textSoft);line-height:1.6;">
          Life Planner adalah personal dashboard offline-first untuk mengatur agenda, tugas, keuangan, catatan, kebiasaan, jurnal, dan tujuan pribadi dalam satu tempat.<br/><br/>
          Data tersimpan otomatis di browser yang kamu pakai (localStorage + cadangan IndexedDB), jadi tidak hilang saat halaman ditutup atau di-refresh. Gunakan Export untuk cadangan tambahan.<br/><br/>
          Dibuat dengan ❤️ untuk penggunaan sehari-hari.
        </div>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
          <div style="font-size:11.5px;color:var(--textSoft);">Dibuat oleh</div>
          <div style="font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;margin:2px 0 0;">${esc(CREATOR.name)}</div>
          ${Object.values(CREATOR.socials).some((v) => String(v || "").trim()) ? `<div class="scrollx" style="flex-wrap:wrap;margin-top:10px;">
            ${Object.entries(CREATOR.socials).map(([k, v]) => { const u = socialUrl(k, v); return u ? `<a class="chip active" style="text-decoration:none;" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(k)}</a>` : ""; }).join("")}
          </div>` : ""}
        </div>
      </div>
    </div>`;
  },

  renderEditProfileSheet() {
    const p = this.state.profile;
    return `<div class="backdrop" onclick="App.closeOverlay()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="handle"></div>
        <div class="head"><div class="t">Edit Profile</div><button onclick="App.closeOverlay()">${icon("x", 15, "var(--textSoft)")}</button></div>
        <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:20px;">
          <label style="position:relative;cursor:pointer;">
            <div class="avatar" id="profPhotoPreview" style="width:80px;height:80px;">${p.photo ? `<img src="${p.photo}"/>` : logoSvg(48, "var(--navy)", false)}</div>
            <div style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;">${icon("camera", 12, "#fff")}</div>
            <input type="file" accept="image/*" style="display:none;" onchange="App.handleProfilePhoto(this)" />
          </label>
          <div style="font-size:11px;color:var(--textSoft);margin-top:8px;">Ketuk untuk ganti foto profil</div>
          <button id="profPhotoRemove" style="font-size:11px;color:var(--danger);margin-top:4px;${p.photo ? "" : "display:none;"}" onclick="App.removeProfilePhoto()">Hapus foto</button>
        </div>
        <div class="field"><label>Nama</label><input id="pf-name" value="${esc(p.name)}" placeholder="Nama kamu" /></div>
        <div class="field"><label>Email</label><input id="pf-email" type="email" value="${esc(p.email)}" placeholder="email@contoh.com" /></div>
        <button class="btn-primary" onclick="App.submitProfile()">Save Profile</button>
      </div>
    </div>`;
  },
  _pendingPhoto: undefined,
  handleProfilePhoto(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      this._pendingPhoto = reader.result;
      const prev = document.getElementById("profPhotoPreview");
      if (prev) prev.innerHTML = `<img src="${reader.result}"/>`;
      const rm = document.getElementById("profPhotoRemove");
      if (rm) rm.style.display = "";
    };
    reader.readAsDataURL(file);
  },
  removeProfilePhoto() {
    this._pendingPhoto = null;
    const prev = document.getElementById("profPhotoPreview");
    if (prev) prev.innerHTML = logoSvg(48, "var(--navy)", false);
    const rm = document.getElementById("profPhotoRemove");
    if (rm) rm.style.display = "none";
  },
  submitProfile() {
    const name = document.getElementById("pf-name").value.trim();
    const email = document.getElementById("pf-email").value.trim();
    const photo = this._pendingPhoto !== undefined ? this._pendingPhoto : this.state.profile.photo;
    this._pendingPhoto = undefined;
    this.saveProfile(name, email, photo);
    this.render();
  },

  renderImportSheet() {
    return `<div class="backdrop" onclick="App.closeOverlay()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="handle"></div>
        <div class="head"><div class="t">Import Data</div><button onclick="App.closeOverlay()">${icon("x", 15, "var(--textSoft)")}</button></div>
        <label style="width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:32px 0;background:var(--surfaceAlt);border:1.5px dashed var(--border);cursor:pointer;">
          ${icon("upload", 22, "var(--accent)")}
          <span style="font-size:12.5px;color:var(--textSoft);">Pilih file backup (.json)</span>
          <input type="file" accept="application/json" style="display:none;" onchange="App.importFile(this)" />
        </label>
      </div>
    </div>`;
  },
});

/* ---------------- PAGES: Tasks / Goals / Habits / Journal / Statistics ---------------- */
Object.assign(App, {
  renderPage() {
    const page = this.overlay.page;
    const titles = { tasks: "Tasks", goals: "Goals", habits: "Habits", journal: "Journal", stats: "Statistics" };
    const addType = { tasks: "task", goals: "goal", habits: "habit", journal: "journal" }[page];
    let body = "";
    if (page === "tasks") body = this.pageTasks();
    else if (page === "goals") body = this.pageGoals();
    else if (page === "habits") body = this.pageHabits();
    else if (page === "journal") body = this.pageJournal();
    else if (page === "stats") body = this.pageStats();
    return `<div class="page">
      <div class="topbar">
        <div class="left"><button class="iconbtn" onclick="App.closeOverlay()">${icon("chevronLeft", 18)}</button><div class="title">${titles[page]}</div></div>
        ${addType ? `<button class="iconbtn" style="background:var(--accentSoft);border:none;" onclick='App.openOverlay({type:"form",formType:"${addType}"})'>${icon("plus", 16, "var(--accent)")}</button>` : `<span></span>`}
      </div>
      <div class="body">${body}</div>
    </div>`;
  },

  pageTasks() {
    const all = this.state.tasks;
    if (all.length === 0) return `<div class="empty"><div class="ic">${icon("listcheck", 26, "var(--accent)")}</div><div class="t">No tasks yet</div><div class="s">Tambahkan task pertamamu.</div><button onclick='App.openOverlay({type:"form",formType:"task"})'>+ Add Task</button></div>`;
    const today = all.filter((t) => t.deadline === TODAY);
    const other = all.filter((t) => t.deadline !== TODAY);
    const progress = today.length ? Math.round((today.filter((t) => t.done).length / today.length) * 100) : 0;
    const priorityColor = { High: "var(--danger)", Medium: "#B4823B", Low: "var(--accent)" };
    const renderTask = (t) => `<div class="card row gap3" style="padding:14px;margin-bottom:10px;">
      <button onclick="App.toggleTask('${t.id}')">${t.done ? icon("checkcircle", 20, "var(--accent)") : icon("circle", 20, "var(--textFaint)")}</button>
      <button style="flex:1;text-align:left;" onclick='App.openOverlay({type:"form",formType:"task",editId:"${t.id}"})'>
        <div style="font-size:13.5px;font-weight:500;${t.done ? "text-decoration:line-through;opacity:.5;" : ""}">${esc(t.title)}</div>
        <div class="row gap2" style="margin-top:4px;"><span style="font-size:9.5px;font-weight:700;color:${priorityColor[t.priority]};">${t.priority}</span><span style="font-size:10px;color:var(--textSoft);">· ${t.category} · ${fmtShortDate(t.deadline)}</span></div>
      </button>
      <div class="row gap2">
        <button onclick='App.openOverlay({type:"form",formType:"task",editId:"${t.id}"})'>${icon("pencil", 13, "var(--textFaint)")}</button>
        <button onclick="App.deleteTask('${t.id}')">${icon("trash", 13, "var(--textFaint)")}</button>
      </div>
    </div>`;
    return `
      <div class="card" style="padding:16px;margin-bottom:20px;">
        <div class="row between" style="margin-bottom:8px;"><span style="font-size:13px;font-weight:600;font-family:'Poppins',sans-serif;">Today's Progress</span><span style="font-size:12px;color:var(--accent);font-weight:700;">${progress}%</span></div>
        <div class="pbar"><div style="width:${progress}%"></div></div>
      </div>
      <div style="font-size:12px;color:var(--textSoft);font-weight:600;margin-bottom:8px;">HARI INI</div>
      ${today.length === 0 ? `<div style="font-size:13px;color:var(--textSoft);padding:12px 0;">Tidak ada task hari ini.</div>` : today.map(renderTask).join("")}
      ${other.length > 0 ? `<div style="font-size:12px;color:var(--textSoft);font-weight:600;margin:16px 0 8px;">LAINNYA</div>${other.map(renderTask).join("")}` : ""}
    `;
  },

  pageGoals() {
    const goals = this.state.goals;
    if (goals.length === 0) return `<div class="empty"><div class="ic">${icon("target", 26, "var(--accent)")}</div><div class="t">No goals yet</div><div class="s">Buat target pertamamu.</div><button onclick='App.openOverlay({type:"form",formType:"goal"})'>+ Add Goal</button></div>`;
    return goals.map((g) => {
      const pct = g.unit === "%" ? g.progress : Math.round((g.progress / g.target) * 100);
      return `<div class="card" style="padding:16px;margin-bottom:12px;">
        <div class="row between" style="margin-bottom:4px;"><div style="font-size:14px;font-weight:600;">${esc(g.name)}</div><span class="badge" style="${g.status === "Completed" ? "" : "background:var(--surfaceAlt);color:var(--textSoft);"}">${g.status}</span></div>
        <div style="font-size:11.5px;color:var(--textSoft);margin-bottom:8px;">${g.unit === "rp" ? `${fmtRp(g.progress)} / ${fmtRp(g.target)}` : `${g.progress} / ${g.target}${g.unit === "%" ? "%" : "x"}`} · Deadline ${fmtShortDate(g.deadline)}</div>
        <div class="row gap2" style="margin-bottom:12px;"><div class="pbar"><div style="width:${pct}%"></div></div><span style="font-size:11.5px;color:var(--accent);font-weight:600;">${pct}%</span></div>
        <div class="row gap3" style="justify-content:flex-end;">
          <button onclick='App.openOverlay({type:"form",formType:"goal",editId:"${g.id}"})'>${icon("pencil", 12, "var(--textFaint)")}</button>
          <button onclick="App.deleteGoal('${g.id}')">${icon("trash", 12, "var(--textFaint)")}</button>
        </div>
      </div>`;
    }).join("");
  },

  pageHabits() {
    const habits = this.state.habits;
    if (habits.length === 0) return `<div class="empty"><div class="ic">${icon("flame", 26, "var(--accent)")}</div><div class="t">No habits yet</div><div class="s">Tambahkan kebiasaan yang ingin dibangun.</div><button onclick='App.openOverlay({type:"form",formType:"habit"})'>+ Add Habit</button></div>`;
    return habits.map((h) => `<div class="card" style="padding:16px;margin-bottom:12px;">
      <div class="row between" style="margin-bottom:12px;">
        <button class="row gap2" onclick="App.toggleHabit('${h.id}')">${h.doneToday ? icon("checkcircle", 20, "var(--accent)") : icon("circle", 20, "var(--textFaint)")}<span style="font-size:13.5px;font-weight:500;">${esc(h.name)}</span></button>
        <div class="row gap2">
          ${h.streak > 0 ? `<div class="row gap2" style="padding:4px 8px;border-radius:99px;background:#FBEEDB;">${icon("flame", 11, "#C9862B")}<span style="font-size:10.5px;font-weight:700;color:#C9862B;">${h.streak} Days</span></div>` : ""}
          <button onclick='App.openOverlay({type:"form",formType:"habit",editId:"${h.id}"})'>${icon("pencil", 12, "var(--textFaint)")}</button>
          <button onclick="App.deleteHabit('${h.id}')">${icon("trash", 12, "var(--textFaint)")}</button>
        </div>
      </div>
      <div class="row gap2">${h.log.map((v) => `<div style="flex:1;height:20px;border-radius:5px;background:${v ? "var(--accent)" : "var(--surfaceAlt)"};"></div>`).join("")}</div>
    </div>`).join("");
  },

  pageJournal() {
    const journal = this.state.journal;
    if (journal.length === 0) return `<div class="empty"><div class="ic">${icon("book", 26, "var(--accent)")}</div><div class="t">No journal entries</div><div class="s">Tulis apa yang kamu rasakan hari ini.</div><button onclick='App.openOverlay({type:"form",formType:"journal"})'>+ Write Entry</button></div>`;
    return journal.map((j) => `<div class="card" style="padding:16px;margin-bottom:12px;">
      <div class="row between" style="margin-bottom:8px;">
        <div class="row gap2"><span style="font-size:18px;">${MOODS[j.mood] ? MOODS[j.mood].icon : ""}</span><div><div style="font-size:12.5px;font-weight:600;">${fmtShortDate(j.date)}</div><div style="font-size:10.5px;color:var(--textSoft);">${MOODS[j.mood] ? MOODS[j.mood].label : ""}</div></div></div>
        <div class="row gap3"><button onclick='App.openOverlay({type:"form",formType:"journal",editId:"${j.id}"})'>${icon("pencil", 12, "var(--textFaint)")}</button><button onclick="App.deleteJournal('${j.id}')">${icon("trash", 12, "var(--textFaint)")}</button></div>
      </div>
      <div style="font-size:12.5px;color:var(--textSoft);line-height:1.5;">${esc(j.content)}</div>
    </div>`).join("");
  },

  pageStats() {
    const d = this.state;
    const completedTasks = d.tasks.filter((t) => t.done).length;
    const totalExpenseMonth = d.transactions.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
    const goalsCompleted = d.goals.filter((g) => g.status === "Completed").length;
    const bestStreak = Math.max(0, ...d.habits.map((h) => h.streak));
    const cards = [
      ["Tasks Selesai", completedTasks], ["Total Agenda", d.events.length], ["Total Notes", d.notes.length],
      ["Pengeluaran Bulan Ini", fmtRp(totalExpenseMonth)], ["Target Selesai", goalsCompleted], ["Habit Streak Terbaik", bestStreak + " hari"],
    ];
    const week = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
    const productivity = [60,80,45,90,70,30,55];
    return `<div class="grid2" style="margin-bottom:20px;">
      ${cards.map(([label, value]) => `<div class="card" style="padding:14px;"><div style="font-size:15px;font-weight:700;font-family:'Poppins',sans-serif;">${value}</div><div style="font-size:10.5px;color:var(--textSoft);margin-top:2px;">${label}</div></div>`).join("")}
    </div>
    <div class="section-title">Produktivitas Mingguan</div>
    <div class="card" style="padding:16px;height:140px;display:flex;align-items:flex-end;gap:10px;">
      ${productivity.map((v, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
        <div style="width:100%;height:${v}%;border-radius:6px;background:var(--accent);opacity:.85;"></div><span style="font-size:9.5px;color:var(--textSoft);">${week[i]}</span></div>`).join("")}
    </div>`;
  },
});

/* ---------------- FORM SHEET (Add/Edit for every entity) ---------------- */
Object.assign(App, {
  _findEditing() {
    const ov = this.overlay;
    if (!ov || !ov.editId) return null;
    const map = {
      task: this.state.tasks, note: this.state.notes, event: this.state.events,
      expense: this.state.transactions, income: this.state.transactions,
      goal: this.state.goals, habit: this.state.habits, journal: this.state.journal,
    };
    const arr = map[ov.formType];
    return arr ? arr.find((x) => x.id === ov.editId) || null : null;
  },

  renderFormSheet() {
    const type = this.overlay.formType;
    const editing = this._findEditing();
    const addTitles = { task: "Add Task", note: "Add Note", expense: "Add Expense", income: "Add Income", event: "Add Event", goal: "Add Goal", habit: "Add Habit", journal: "Write Journal" };
    const editTitles = { task: "Edit Task", note: "Edit Note", expense: "Edit Expense", income: "Edit Income", event: "Edit Agenda", goal: "Edit Goal", habit: "Edit Habit", journal: "Edit Journal" };
    const title = editing ? editTitles[type] : addTitles[type];
    let body = "";
    if (type === "task") body = this.formTask(editing);
    else if (type === "note") body = this.formNote(editing);
    else if (type === "expense" || type === "income") body = this.formTransaction(editing, type);
    else if (type === "event") body = this.formEvent(editing);
    else if (type === "goal") body = this.formGoal(editing);
    else if (type === "habit") body = this.formHabit(editing);
    else if (type === "journal") body = this.formJournal(editing);
    return `<div class="backdrop" onclick="App.closeOverlay()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="handle"></div>
        <div class="head"><div class="t">${title}</div><button onclick="App.closeOverlay()">${icon("x", 15, "var(--textSoft)")}</button></div>
        ${body}
      </div>
    </div>`;
  },

  chipRow(id, options, current) {
    return `<div class="row gap2" style="flex-wrap:wrap;" id="${id}">${options.map((o) => {
      const val = typeof o === "string" ? o : o.v;
      const label = typeof o === "string" ? o : o.l;
      const color = typeof o === "object" && o.color ? o.color : "var(--accent)";
      const active = val === current;
      return `<button type="button" class="chip ${active ? "active" : ""}" style="${active ? `background:${color};border-color:${color};` : ""}" data-val="${val}" onclick="App.pickChip('${id}', this)">${label}</button>`;
    }).join("")}</div>`;
  },
  pickChip(groupId, btn) {
    const group = document.getElementById(groupId);
    group.querySelectorAll(".chip").forEach((c) => { c.classList.remove("active"); c.style.background = ""; c.style.borderColor = ""; });
    btn.classList.add("active");
    group.dataset.value = btn.dataset.val;
    // recolor active chip using its intended color if present via lookup handled by caller (simplified: use accent)
    btn.style.background = "var(--accent)"; btn.style.borderColor = "var(--accent)";
  },
  chipValue(id, fallback) {
    const el = document.getElementById(id);
    if (!el) return fallback;
    const active = el.querySelector(".chip.active");
    return active ? active.dataset.val : (el.dataset.value || fallback);
  },

  formTask(editing) {
    return `
      <div class="field"><label>Judul Task</label><input id="f-title" value="${editing ? esc(editing.title) : ""}" placeholder="Contoh: Kerjakan tugas..." /></div>
      <div class="field"><label>Prioritas</label>${this.chipRow("f-priority", ["Low","Medium","High"], editing ? editing.priority : "Medium")}</div>
      <div class="field"><label>Kategori</label><select id="f-category">${AGENDA_CATS.map((c) => `<option ${editing && editing.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label>Deadline</label><input id="f-deadline" type="date" value="${editing ? editing.deadline : TODAY}" /></div>
      <button class="btn-primary" onclick="App.submitTask('${editing ? editing.id : ""}')">Save Task</button>
      ${editing ? `<button class="btn-danger" onclick="App.deleteTask('${editing.id}'); App.closeOverlay(); App.showToast('Task dihapus');">${icon("trash",13)} Hapus Task</button>` : ""}
    `;
  },
  submitTask(id) {
    const title = document.getElementById("f-title").value.trim();
    if (!title) return;
    const data = {
      title,
      priority: this.chipValue("f-priority", "Medium"),
      category: document.getElementById("f-category").value,
      deadline: document.getElementById("f-deadline").value || TODAY,
    };
    if (id) { this.updateTask(id, data); this.showToast("Task diperbarui ✓"); } else { this.addTask(data); this.showToast("Task ditambahkan ✓"); }
    this.closeOverlay();
  },

  formNote(editing) {
    return `
      <div class="field"><label>Judul</label><input id="f-title" value="${editing ? esc(editing.title) : ""}" placeholder="Judul catatan" /></div>
      <div class="field"><label>Isi Catatan</label><textarea id="f-content" placeholder="Tulis sesuatu...">${editing ? esc(editing.content) : ""}</textarea></div>
      <div class="field"><label>Kategori</label><select id="f-category">${NOTE_CATS.map((c) => `<option ${editing && editing.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <button class="btn-primary" onclick="App.submitNote('${editing ? editing.id : ""}')">Save Note</button>
      ${editing ? `<button class="btn-danger" onclick="App.deleteNote('${editing.id}'); App.closeOverlay(); App.showToast('Catatan dihapus');">${icon("trash",13)} Hapus Catatan</button>` : ""}
    `;
  },
  submitNote(id) {
    const title = document.getElementById("f-title").value.trim();
    if (!title) return;
    const data = { title, content: document.getElementById("f-content").value, category: document.getElementById("f-category").value };
    if (id) { this.updateNote(id, data); this.showToast("Catatan diperbarui ✓"); } else { this.addNote(data); this.showToast("Catatan disimpan ✓"); }
    this.closeOverlay();
  },

  formTransaction(editing, kind) {
    const type = editing ? editing.type : kind;
    return `
      <div class="field"><label>Tipe</label>${this.chipRow("f-type", [{v:"expense",l:"Expense"},{v:"income",l:"Income"}], type)}</div>
      <div class="field"><label>Jumlah (Rp)</label><input id="f-amount" type="number" value="${editing ? editing.amount : ""}" placeholder="0" /></div>
      <div class="field"><label>Kategori</label><select id="f-category">${(type === "income" ? INCOME_CATS : EXPENSE_CATS).map((c) => `<option ${editing && editing.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label>Tanggal</label><input id="f-date" type="date" value="${editing ? editing.date : TODAY}" /></div>
      <div class="field"><label>Catatan</label><input id="f-note" value="${editing ? esc(editing.note) : ""}" placeholder="Opsional" /></div>
      <button class="btn-primary" onclick="App.submitTransaction('${editing ? editing.id : ""}')">Save Transaction</button>
      ${editing ? `<button class="btn-danger" onclick="App.deleteTransaction('${editing.id}'); App.closeOverlay(); App.showToast('Transaksi dihapus');">${icon("trash",13)} Hapus Transaksi</button>` : ""}
    `;
  },
  submitTransaction(id) {
    const amount = Number(document.getElementById("f-amount").value);
    if (!amount) return;
    const data = {
      type: this.chipValue("f-type", "expense"),
      amount,
      category: document.getElementById("f-category").value,
      date: document.getElementById("f-date").value || TODAY,
      note: document.getElementById("f-note").value,
    };
    if (id) { this.updateTransaction(id, data); this.showToast("Transaksi diperbarui ✓"); } else { this.addTransaction(data); this.showToast("Transaksi ditambahkan ✓"); }
    this.closeOverlay();
  },

  formEvent(editing) {
    const date = editing ? editing.date : (this.overlay.formDate || TODAY);
    return `
      <div class="field"><label>Judul Agenda</label><input id="f-title" value="${editing ? esc(editing.title) : ""}" placeholder="Contoh: Meeting Project" /></div>
      <div class="field"><label>Tanggal</label><input id="f-date" type="date" value="${date}" /></div>
      <div class="field"><label>Waktu</label><input id="f-time" type="time" value="${editing ? editing.time : "09:00"}" /></div>
      <div class="field"><label>Lokasi</label><input id="f-location" value="${editing ? esc(editing.location) : ""}" placeholder="Opsional" /></div>
      <div class="field"><label>Kategori</label>${this.chipRow("f-category", AGENDA_CATS, editing ? editing.category : AGENDA_CATS[0])}</div>
      <button class="btn-primary" onclick="App.submitEvent('${editing ? editing.id : ""}')">Save Agenda</button>
      ${editing ? `<button class="btn-danger" onclick="App.deleteEvent('${editing.id}'); App.closeOverlay(); App.showToast('Agenda dihapus');">${icon("trash",13)} Hapus Agenda</button>` : ""}
    `;
  },
  submitEvent(id) {
    const title = document.getElementById("f-title").value.trim();
    if (!title) return;
    const data = {
      title,
      date: document.getElementById("f-date").value || TODAY,
      time: document.getElementById("f-time").value || "09:00",
      location: document.getElementById("f-location").value,
      category: this.chipValue("f-category", AGENDA_CATS[0]),
    };
    if (id) { this.updateEvent(id, data); this.showToast("Agenda diperbarui ✓"); }
    else { data.notified = false; this.addEvent(data); this.showToast("Agenda ditambahkan ✓"); }
    this.closeOverlay();
    if (this.state.settings.notifEnabled) this.startNotifLoop();
  },

  formGoal(editing) {
    return `
      <div class="field"><label>Nama Target</label><input id="f-name" value="${editing ? esc(editing.name) : ""}" placeholder="Contoh: Menabung Rp5.000.000" /></div>
      <div class="field"><label>Target Nilai</label><input id="f-target" type="number" value="${editing ? editing.target : ""}" placeholder="0" /></div>
      ${editing ? `<div class="field"><label>Progress Saat Ini</label><input id="f-progress" type="number" value="${editing.progress}" placeholder="0" /></div>` : ""}
      <div class="field"><label>Satuan</label>${this.chipRow("f-unit", [{v:"x",l:"Kali"},{v:"%",l:"Persen"},{v:"rp",l:"Rupiah"}], editing ? editing.unit : "x")}</div>
      ${editing ? `<div class="field"><label>Status</label>${this.chipRow("f-status", ["Active","Completed","Paused"], editing.status)}</div>` : ""}
      <button class="btn-primary" onclick="App.submitGoal('${editing ? editing.id : ""}')">Save Goal</button>
      ${editing ? `<button class="btn-danger" onclick="App.deleteGoal('${editing.id}'); App.closeOverlay(); App.showToast('Target dihapus');">${icon("trash",13)} Hapus Goal</button>` : ""}
    `;
  },
  submitGoal(id) {
    const name = document.getElementById("f-name").value.trim();
    const target = Number(document.getElementById("f-target").value);
    if (!name || !target) return;
    if (id) {
      const progress = Number(document.getElementById("f-progress").value) || 0;
      this.updateGoal(id, { name, target, progress, unit: this.chipValue("f-unit", "x"), status: this.chipValue("f-status", "Active") });
      this.showToast("Target diperbarui ✓");
    } else {
      this.addGoal({ name, target, unit: this.chipValue("f-unit", "x"), deadline: TODAY });
      this.showToast("Target ditambahkan ✓");
    }
    this.closeOverlay();
  },

  formHabit(editing) {
    return `
      <div class="field"><label>Nama Kebiasaan</label><input id="f-name" value="${editing ? esc(editing.name) : ""}" placeholder="Contoh: Minum air 2 liter" /></div>
      <button class="btn-primary" onclick="App.submitHabit('${editing ? editing.id : ""}')">Save Habit</button>
      ${editing ? `<button class="btn-danger" onclick="App.deleteHabit('${editing.id}'); App.closeOverlay(); App.showToast('Kebiasaan dihapus');">${icon("trash",13)} Hapus Habit</button>` : ""}
    `;
  },
  submitHabit(id) {
    const name = document.getElementById("f-name").value.trim();
    if (!name) return;
    if (id) { this.updateHabit(id, { name }); this.showToast("Kebiasaan diperbarui ✓"); }
    else { this.addHabit(name); this.showToast("Kebiasaan ditambahkan ✓"); }
    this.closeOverlay();
  },

  formJournal(editing) {
    const mood = editing ? editing.mood : "good";
    return `
      <div class="field"><label>Mood</label><div class="row gap2" id="f-mood" style="flex-wrap:wrap;">
        ${Object.entries(MOODS).map(([k, m]) => `<button type="button" style="flex:1;min-width:50px;display:flex;flex-direction:column;align-items:center;padding:10px 0;border-radius:12px;background:${k === mood ? "var(--accentSoft)" : "var(--surfaceAlt)"};border:1px solid ${k === mood ? "var(--accent)" : "transparent"};" data-val="${k}" onclick="App.pickMood(this)"><span style="font-size:18px;">${m.icon}</span></button>`).join("")}
      </div></div>
      <div class="field"><label>Ceritakan harimu</label><textarea id="f-content" placeholder="Apa yang kamu rasakan hari ini?">${editing ? esc(editing.content) : ""}</textarea></div>
      <button class="btn-primary" onclick="App.submitJournal('${editing ? editing.id : ""}')">Save Entry</button>
      ${editing ? `<button class="btn-danger" onclick="App.deleteJournal('${editing.id}'); App.closeOverlay(); App.showToast('Jurnal dihapus');">${icon("trash",13)} Hapus Entry</button>` : ""}
    `;
  },
  pickMood(btn) {
    const group = document.getElementById("f-mood");
    group.querySelectorAll("button").forEach((b) => { b.style.background = "var(--surfaceAlt)"; b.style.borderColor = "transparent"; });
    btn.style.background = "var(--accentSoft)"; btn.style.borderColor = "var(--accent)";
    group.dataset.value = btn.dataset.val;
  },
  submitJournal(id) {
    const content = document.getElementById("f-content").value.trim();
    if (!content) return;
    const moodGroup = document.getElementById("f-mood");
    const mood = moodGroup.dataset.value || "good";
    if (id) { this.updateJournal(id, { mood, content }); this.showToast("Jurnal diperbarui ✓"); }
    else { this.addJournal({ mood, content }); this.showToast("Jurnal disimpan ✓"); }
    this.closeOverlay();
  },
});

window.App = App;
document.addEventListener("DOMContentLoaded", () => App.init());
window.addEventListener("pagehide", () => { if (App.state) App.save(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && App.state) App.save(); });

</script>
</body>
</html>
